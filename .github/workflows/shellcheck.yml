name: ShellCheck

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax check
        run: |
          bash -n xwiki-lxc.sh
          bash -n install/xwiki-install.sh
      - name: ShellCheck
        run: shellcheck -x xwiki-lxc.sh install/xwiki-install.sh
